spring.application.name=secure-employee-project
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_project_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.jwt.secret=${JWT_SECRET:JWT_SECRET=MyDummyJwtSecretKeyForTestingOnly123456}
app.jwt.access-minutes=15
app.jwt.refresh-days=7
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@gmail.com}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123456}
logging.level.org.springframework.security=INFO
logging.level.com.example.auth=INFO
server.error.include-message=never
logging.level.root=INFO
logging.level.com.yourpackage=DEBUG
logging.file.name=logs/application.log