services:
  mysql:
    image: mysql:8.4
    container_name: employee-project-mysql
    environment:
      MYSQL_DATABASE: employee_project_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me_local}
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change_me_local}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [employee_db:/var/lib/mysql]
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/employee_project_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-change_me_local}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-this-secret-please-123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123!}
    ports: ["8081:8081"]
volumes:
  employee_db:
